aid: interface-fluidics
name: Interface Fluidics
description: Interface Fluidics is a Calgary-based microfluidics company serving the energy industry
  with high-pressure, high-temperature (HPHT) laboratory testing systems and reservoir fluid analysis
  services. Its SapphireLab Pro+ platform and standard and custom microfluidic chips deliver direct
  visual insights for PVT and phase-behavior characterization, enhanced oil recovery (EOR) evaluation,
  flow assurance studies, and fracturing fluid testing, using small sample volumes at high throughput.
  Customers include Equinor, ExxonMobil, Chevron, TotalEnergies, and Shell, along with research
  institutions such as Rice University and PUC-Rio. The company operates customer-facing software
  (a SapphireLab LIMS portal and desktop apps) but publishes no public developer API, SDK, or OpenAPI
  at this time.
